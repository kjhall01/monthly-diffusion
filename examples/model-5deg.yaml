# 5-degree connectivity-safe variant: only M3 -> M2 is used.
# All non-topological settings are inherited from the frozen model.yaml.
ae_width: 102
latent_channels: 4
mesh_levels: [3, 2]
refiners: [6, 4]
# The geometry API retains the three-angle rotation tuple; the first two
# entries are used by the remaining M3/M2 levels and the final entry is inert.
rotation: [17, 23, 11]
centering: annual_zonal
# Opt-in land-aware ocean ECC; leave false for the historical baseline.
# ocean_mask_aware: true
transition_width: 132
transition_depth: 4
transition_heads: 4
transition_ffn_ratio: 1.55
time_embedding_channels: 64
coupling: jacobi
cross_gradients: false
atmosphere_tau: 0.5
ocean_tau: 6.0
autoencoder_training:
  batch_size: 4
  max_epochs: 1000
  patience: 5
  min_delta: 0.0001
  seed: 20260716
diffusion_training:
  batch_size: 4
  max_epochs: 1000
  patience: 5
  min_delta: 0.0001
  seed: 20260716
  rollout_steps: 3
  loss_weight: 0.01
